<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#03060e"/>
    </linearGradient>

    <!-- Neon Green/Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#00FF88" fill-opacity="0.2"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(240px); opacity: 0; }
    }
    .pulse-dot { animation: pulse 2.5s infinite ease-in-out; }
    .scan-line { animation: scan 4s infinite linear; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="14" fill="url(#cyberGrid)"/>

  <!-- Outer Neon Border -->
  <rect x="1.5" y="1.5" width="897" height="237" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Decorative Corner Tech Brackets -->
  <path d="M 12 35 L 12 12 L 35 12" fill="none" stroke="#00FF88" stroke-width="2.5"/>
  <path d="M 888 35 L 888 12 L 865 12" fill="none" stroke="#00FF88" stroke-width="2.5"/>
  <path d="M 12 205 L 12 228 L 35 228" fill="none" stroke="#00FF88" stroke-width="2.5"/>
  <path d="M 888 205 L 888 228 L 865 228" fill="none" stroke="#00FF88" stroke-width="2.5"/>

  <!-- Radar / Tech Circles Background Decoration -->
  <circle cx="800" cy="120" r="90" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.15"/>
  <circle cx="800" cy="120" r="60" fill="none" stroke="#00FF88" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="800" cy="120" r="30" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="2 4" opacity="0.2"/>
  <line x1="710" y1="120" x2="890" y2="120" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="800" y1="30" x2="800" y2="210" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Status Tag Pill -->
  <g transform="translate(45, 32)">
    <rect width="260" height="26" rx="13" fill="#021f18" stroke="#00FF88" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="13" r="4.5" fill="#00FF88" filter="url(#glow)" class="pulse-dot"/>
    <text x="30" y="17" fill="#00FF88" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" letter-spacing="1">DEFENSIVE SYSTEMS &amp; SOC</text>
  </g>

  <!-- Main Name Title -->
  <text x="45" y="106" fill="url(#neonCyan)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" filter="url(#glow)">
    KREESTEN-EDDY AGBOTON
  </text>

  <!-- Subtitle / Role -->
  <text x="45" y="138" fill="#94A3B8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13.5" font-weight="600" letter-spacing="1">
    CYBERSECURITY RESEARCHER <tspan fill="#00FF88">//</tspan> SOC &amp; THREAT HUNTING <tspan fill="#00E5FF">//</tspan> SECENG
  </text>

  <!-- Core Pillars / Real Project Pills -->
  <g transform="translate(45, 172)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="30" rx="6" fill="#0b172a" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">🛡️ SentinelSOC</text>
      <circle cx="166" cy="15" r="3" fill="#00FF88"/>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(192, 0)">
      <rect width="210" height="30" rx="6" fill="#0b172a" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">🇧🇯 BENIN CYBER SHIELD</text>
      <circle cx="196" cy="15" r="3" fill="#00E5FF"/>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(414, 0)">
      <rect width="165" height="30" rx="6" fill="#0b172a" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">💳 FinGuard-NHI</text>
      <circle cx="151" cy="15" r="3" fill="#3B82F6"/>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(591, 0)">
      <rect width="145" height="30" rx="6" fill="#0b172a" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">🔒 AdShield</text>
      <circle cx="131" cy="15" r="3" fill="#00FF88"/>
    </g>
  </g>
</svg>
